name: Branch Protection

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint check
      run: npm run lint

    - name: Run TypeScript check
      run: npm run type-check

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Check test coverage threshold
      run: |
        COVERAGE=$(npm run test:coverage -- --silent | grep "All files" | awk '{print $10}' | sed 's/%//')
        if [ "$COVERAGE" -lt 80 ]; then
          echo "❌ Test coverage is below 80% ($COVERAGE%)"
          exit 1
        else
          echo "✅ Test coverage is acceptable ($COVERAGE%)"
        fi

    - name: Security audit
      run: npm audit --audit-level=high

    - name: Check for TODO/FIXME comments
      run: |
        TODO_COUNT=$(grep -r "TODO\|FIXME" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | wc -l)
        if [ "$TODO_COUNT" -gt 10 ]; then
          echo "❌ Too many TODO/FIXME comments found ($TODO_COUNT). Please address them before merging."
          exit 1
        else
          echo "✅ TODO/FIXME comments are within acceptable limits ($TODO_COUNT)"
        fi

    - name: Quality Gate Summary
      if: success()
      run: |
        echo "🎉 All quality checks passed!"
        echo "✅ Linting: PASSED"
        echo "✅ TypeScript: PASSED"
        echo "✅ Tests: PASSED"
        echo "✅ Coverage: PASSED"
        echo "✅ Security: PASSED"
        echo "✅ Code Quality: PASSED"