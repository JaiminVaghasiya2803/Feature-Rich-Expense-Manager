name: Lint Check

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Lint Summary
      if: failure()
      run: |
        echo "❌ Linting failed! Please fix the errors before merging."
        echo "Run 'npm run lint' locally to see detailed errors."
        exit 1

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript compilation check
      run: npx tsc --noEmit

    - name: TypeScript Summary
      if: failure()
      run: |
        echo "❌ TypeScript compilation failed! Please fix the type errors."
        echo "Run 'npx tsc --noEmit' locally to see detailed errors."
        exit 1