name: Lint Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Verify npm installation
      run: |
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        which npm || (echo "❌ npm not found" && exit 1)

    - name: Check package.json exists
      run: |
        if [ ! -f "package.json" ]; then
          echo "❌ package.json not found"
          exit 1
        fi
        echo "✅ package.json found"

    - name: Install dependencies
      run: |
        echo "📦 Installing dependencies..."
        npm ci --prefer-offline --no-audit
        echo "✅ Dependencies installed successfully"

    - name: Verify ESLint installation
      run: |
        if ! npm list eslint > /dev/null 2>&1; then
          echo "❌ ESLint not installed"
          exit 1
        fi
        echo "✅ ESLint is available"

    - name: Run ESLint
      run: |
        echo "🔍 Running ESLint..."
        npm run lint
        echo "✅ ESLint check completed"

    - name: Lint Summary
      if: failure()
      run: |
        echo "❌ Linting failed! Please fix the errors before merging."
        echo "Run 'npm run lint' locally to see detailed errors."
        exit 1
